# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/programs.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/keybinds/keybinds.conf

general {
    border_size = 0
    gaps_in = 3
    gaps_out = 6
	#col.active_border = rgba(ca9ee6ff) rgba(f2d5cfff) 45deg
	#col.inactive_border = rgba(b4befecc) rgba(6c7086cc) 45deg
    resize_on_border = true
    hover_icon_on_border = true
    allow_tearing = false
    layout = dwindle
}

xwayland {
    force_zero_scaling = true
    create_abstract_socket = true
}

opengl {
    nvidia_anti_flicker = true
}

render {
    direct_scanout = 2
}

#group {
#    col.border_active = rgba(ca9ee6ff) rgba(f2d5cfff) 45deg
#    col.border_inactive = rgba(b4befecc) rgba(6c7086cc) 45deg
#    col.border_locked_active = rgba(ca9ee6ff) rgba(f2d5cfff) 45deg
#    col.border_locked_inactive = rgba(b4befecc) rgba(6c7086cc) 45deg
#}

cursor {
    no_hardware_cursors = 0
    default_monitor = DP-3
}

decoration {
    rounding = 8
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        xray = false
        vibrancy = 0.1696
    }
    shadow {
		enabled = true
		render_power = 1
		range = 6
		color = 0x88ffffff
		color_inactive = 0xaa1a1a1a
	}
}

animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
workspace = w[tv1]s[false], gapsout:0, gapsin:0
workspace = f[1]s[false], gapsout:0, gapsin:0
windowrule {
    name = no-gaps-wtv1
    match:float = false
    match:workspace = w[tv1]s[false]

    border_size = 0
    rounding = 0
	no_shadow = on
}

windowrule {
    name = no-gaps-f1
    match:float = false
    match:workspace = f[1]s[false]

    border_size = 0
    rounding = 0
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/
master {
    new_status = master
}

# See https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
    animate_manual_resizes = true
}

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = true
}


windowrule {
    name = gtk-settings

    match:class = ^(nwg-look)$
    match:title = ^(nwg-look)$

    float = true
    size = 40%
}

windowrule {
    name = video-popup

    match:title = ^(Picture-in-Picture)$

    float = true
	no_shadow = true
    opacity = 0.7
    size = 30%
	keep_aspect_ratio = true
    move = (monitor_w-window_w) (monitor_h-window_h)

}


windowrule = float 1       , match:class ^(org.pulseaudio.pavucontrol)$
windowrule = opacity 0.85  , match:class ^(Spotify)$

workspace  = special:magic, on-created-empty:[float; opacity 0.8; size 70%] $terminal
