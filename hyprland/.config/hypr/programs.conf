$terminal = uwsm app -- kitty.desktop
$menu = rofi -show drun -run-command "uwsm app -- {cmd}"

#exec-once = wl-paste --type text --watch cliphist store
#exec-once = wl-paste --type image --watch cliphist store
#exec-once = xrandr --output DP-3 --primary

exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec = gsettings set org.gnome.desktop.interface cursor-theme "Bibata-Modern-Ice"
exec = gsettings set org.gnome.desktop.interface gtk-key-theme "Ligmacs"

exec-once = hyprctl dispatch exec [workspace 1] -- uwsm app -- firefox-developer-edition
