input {
    kb_model = pc104
    kb_layout = us, us
    kb_variant = dvp,
    repeat_rate = 30 # 25
    repeat_delay = 200 # 600
    follow_mouse = 1
    numlock_by_default = true
    resolve_binds_by_sym = 1
